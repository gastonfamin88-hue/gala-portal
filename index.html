<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALA · Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --azul:#0f4c5c; --azul-claro:#e7f1f3; --teal:#3F7D5C; --verde:#1e8e5a; --amarillo:#c9950c;
  --rojo:#c0392b; --gris:#8a97a0; --bg:#f4f6f7; --card:#ffffff; --texto:#1e2b2f; --borde:#dfe6e8;
  --font: "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--texto);}
header{background:var(--azul);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
header h1{font-size:18px;margin:0;font-weight:600;}
header .sub{font-size:12px;opacity:.85;}
.header-actions button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin-left:6px;}
.header-actions button:hover{background:rgba(255,255,255,.28);}
#nav-tabs{display:flex;gap:4px;flex-wrap:wrap;background:#0c3946;padding:6px 20px;}
.tab{background:transparent;border:none;color:#cfe3e6;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;}
.tab:hover{background:rgba(255,255,255,.08);}
.tab.active{background:var(--bg);color:var(--azul);font-weight:600;}
#main{max-width:980px;margin:20px auto 80px;padding:0 16px;}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.card h2{margin-top:0;font-size:19px;color:var(--azul);}
.card h3{font-size:16px;color:var(--azul);margin:0 0 8px;}
.muted{color:#607077;font-size:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.grid2 label{display:flex;flex-direction:column;font-size:13px;color:#405056;gap:4px;}
.grid2 input{padding:8px 10px;border:1px solid var(--borde);border-radius:6px;font-size:14px;font-family:var(--font);}
.subhead-field{grid-column:1/-1;margin:10px 0 2px;color:var(--teal);font-size:13px;text-transform:uppercase;letter-spacing:.03em;}
.auditores-list{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
.auditor-row{display:flex;gap:8px;align-items:center;}
.auditor-input{flex:1;padding:8px 10px;border:1px solid var(--borde);border-radius:6px;font-size:14px;font-family:var(--font);}
.btn-remove-auditor{background:#fff;border:1px solid var(--borde);color:var(--rojo);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:13px;}
.btn-remove-auditor:hover{background:#fdf1ef;border-color:var(--rojo);}
.btn-add-auditor{align-self:flex-start;background:#fff;border:1.5px dashed var(--teal);color:var(--teal);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin-top:2px;}
.btn-add-auditor:hover{background:var(--azul-claro);}
.pass-wrap{position:relative;display:block;}
.pass-wrap input{width:100%;padding-right:40px;}
.btn-toggle-pass{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;padding:4px;line-height:1;}
.invite-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.btn-share{background:#fff;border:1px solid var(--borde);border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--texto);}
.btn-share:hover{background:var(--azul-claro);border-color:var(--teal);}
.informe-toolbar{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borde);border-radius:8px;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap;}
.informe-toolbar .fmt-btn{background:#f4f6f7;border:1px solid var(--borde);border-radius:5px;width:30px;height:28px;cursor:pointer;font-size:13px;}
.informe-toolbar .fmt-btn:hover{background:var(--azul-claro);}
.informe-toolbar .fmt-label{font-size:12px;color:var(--muted);margin-right:2px;}
.informe-toolbar .fmt-sep{width:1px;height:22px;background:var(--borde);margin:0 4px;}
.informe-toolbar .swatch{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);cursor:pointer;}
.informe-toolbar .swatch:hover{outline:2px solid var(--teal);outline-offset:1px;}
.informe-toolbar .swatch-none{background:#fff;font-size:11px;color:#B23A3A;}
.grid-check{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.check-card{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--borde);border-radius:8px;padding:12px;cursor:pointer;font-size:14px;}
.check-card.checked{border-color:var(--teal);background:var(--azul-claro);}
.check-card input{margin-top:3px;}
.semaforo-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px;color:#fff;}
.semaforo-badge.small{padding:4px 10px;font-size:12px;}
.semaforo-badge.verde{background:var(--verde);}
.semaforo-badge.amarillo{background:var(--amarillo);}
.semaforo-badge.rojo{background:var(--rojo);}
.semaforo-badge.gris{background:var(--gris);}
.area-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.subarea{background:#eef3f4;color:var(--teal);font-weight:600;font-size:13px;padding:6px 10px;border-radius:6px;margin:14px 0 8px;}
.item{border-top:1px solid var(--borde);padding:12px 0;}
.item-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.item-n{margin-left:auto;color:#9aa7ac;font-size:12px;}
.chip{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;color:#fff;}
.chip-critico{background:var(--rojo);}
.chip-importante{background:var(--amarillo);}
.chip-menor{background:var(--gris);}
.chip-info{background:var(--teal);}
.chip-muted{background:#c7d0d3;color:#3c474a;}
.item-text{font-size:14.5px;margin-bottom:4px;}
.item-norm{font-size:12px;color:#5b6b70;font-style:italic;margin-bottom:8px;}
.item-controls{display:flex;flex-direction:column;gap:8px;}
.resp-group{display:flex;gap:6px;flex-wrap:wrap;}
.resp-btn{border:1.5px solid var(--borde);background:#fff;padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;}
.resp-btn:hover{border-color:var(--teal);}
.resp-btn.sel.resp-ok{background:var(--verde);color:#fff;border-color:var(--verde);}
.resp-btn.sel.resp-parcial{background:var(--amarillo);color:#fff;border-color:var(--amarillo);}
.resp-btn.sel.resp-no{background:var(--rojo);color:#fff;border-color:var(--rojo);}
.resp-btn.sel.resp-na{background:var(--gris);color:#fff;border-color:var(--gris);}
.obs-input{padding:7px 10px;border:1px solid var(--borde);border-radius:6px;font-size:13px;font-family:var(--font);}
.mini-areas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.mini-area{padding:6px 10px;border-radius:6px;font-size:12.5px;color:#fff;}
.mini-area.verde{background:var(--verde);}
.mini-area.amarillo{background:var(--amarillo);}
.mini-area.rojo{background:var(--rojo);}
.mini-area.gris{background:var(--gris);}
.card.highlight{border-color:var(--rojo);background:#fdf1ef;}
.btn-primary{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;margin-top:8px;}
.btn-secondary{background:#fff;color:var(--teal);border:1.5px solid var(--teal);padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;margin:8px 8px 0 0;}
.informe-doc{font-size:14px;line-height:1.6;}
.informe-header h1{color:var(--azul);font-size:22px;text-align:center;}
.info-table{width:100%;border-collapse:collapse;margin:14px 0;}
.info-table td{border:1px solid var(--borde);padding:6px 10px;font-size:13.5px;}
.resumen-table{width:100%;border-collapse:collapse;margin:10px 0 20px;}
.resumen-table th,.resumen-table td{border:1px solid var(--borde);padding:7px 10px;font-size:13px;text-align:left;}
.resumen-table th{background:var(--azul-claro);color:var(--azul);}
.plan-line{display:inline-block;margin-top:4px;color:#556;font-size:12.5px;}
.editable-block{background:#fbfdfd;border:1px dashed var(--borde);padding:10px;border-radius:6px;min-height:60px;}
.firmas{display:flex;justify-content:space-around;margin-top:60px;}
.firma-box{text-align:center;font-size:13px;}
.firma-line{border-top:1px solid #333;width:220px;margin-bottom:6px;}
@media print{
  header, #nav-tabs, .no-print, .card:not(.informe-doc){display:none !important;}
  body{background:#fff;}
  #main{max-width:100%;margin:0;padding:0;}
  .informe-doc{box-shadow:none;border:none;padding:0;}
}

</style>
</head>

}

// ---------- Cálculo de puntajes (misma lógica que la herramienta offline) ----------
function calcularArea(gKey, areaIdx, respuestas) {
  const area = GRILLAS[gKey].areas[areaIdx];
  let sumaPonderada = 0, sumaPesos = 0, respondidos = 0, hallazgos = [];
  area.items.forEach(it => {
    const k = keyItem(areaIdx, it.n);
    const r = respuestas[k];
    const resp = r && r.respuesta;
    if (!resp) return;
    respondidos++;
    if (resp === "No Aplica") return;
    const peso = PESO[it.criticidad] || 1;
    sumaPesos += peso;
    sumaPonderada += peso * VALOR[resp];
    if (resp === "No Cumple" || resp === "Cumple Parcialmente") {
      hallazgos.push({ areaIdx, item: it, respuesta: resp, observaciones: r.observaciones || "" });
    }
  });
  const pct = sumaPesos > 0 ? (sumaPonderada / sumaPesos) * 100 : null;
  return { pct, respondidos, total: area.items.length, hallazgos, semaforo: semaforoDe(pct) };
}
function semaforoDe(pct) {
  if (pct === null) return "gris";
  if (pct >= 90) return "verde";
  if (pct >= 70) return "amarillo";
  return "rojo";
}
function calcularGrilla(gKey, respuestas) {
  const areas = GRILLAS[gKey].areas.map((a, i) => calcularArea(gKey, i, respuestas));
  let totalPeso = 0, totalPonderado = 0, hallazgos = [];
  GRILLAS[gKey].areas.forEach((area, idx) => {
    area.items.forEach(it => {
      const k = keyItem(idx, it.n);
      const r = respuestas[k];
      if (!r || !r.respuesta || r.respuesta === "No Aplica") return;
      const peso = PESO[it.criticidad] || 1;
      totalPeso += peso;
      totalPonderado += peso * VALOR[r.respuesta];
    });
    hallazgos = hallazgos.concat(areas[idx].hallazgos);
  });
  const pct = totalPeso > 0 ? (totalPonderado / totalPeso) * 100 : null;
  return { pct, semaforo: semaforoDe(pct), areas, hallazgos };
}

  render();
}

  const { data, error } = await supabase.from("profiles").select("*").eq("id", SESSION.user.id).single();
  if (error) { APP.errorMsg = "No se pudo cargar el perfil: " + error.message; return; }
  PROFILE = data;
  APP.vista = PROFILE.role === "gala_admin" ? "admin_centros" : "cliente_dashboard";
  if (PROFILE.role === "gala_admin") await cargarCentros();
  else await cargarVisitasCliente();
}

  APP.errorMsg = "";
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { APP.errorMsg = error.message; render(); return; }
  SESSION = data.session;
  await cargarPerfil();
  render();
}

async function signup(email, password, nombre, inviteCode) {
  APP.errorMsg = "";
  const { data, error } = await supabase.auth.signUp({
    email, password, options: { data: { nombre } },
  });
  if (error) { APP.errorMsg = error.message; render(); return; }
  SESSION = data.session;
  if (inviteCode) {
    const { error: e2 } = await supabase.rpc("vincular_centro", { p_invite_code: inviteCode });
    if (e2) { APP.errorMsg = "Cuenta creada, pero el código de invitación no es válido: " + e2.message; }
  }
  if (SESSION) { await cargarPerfil(); } else {
    APP.errorMsg = "Cuenta creada. Revisá tu correo para confirmar el acceso y después iniciá sesión.";
    APP.vista = "login";
  }
  render();
}

}

function generarInformeVisita(v) {

    const items = r.hallazgos.filter(h => h.item.criticidad === nivel);
    if (!items.length) return;
    hallazgosHtml += `<p><strong>${nivel}</strong></p><ul>`;
    items.forEach(h => {
      hallazgosHtml += `<li><strong>${esc(h.item.item)}</strong> — Estado: ${h.respuesta}.
        ${h.observaciones ? `Observación: ${esc(h.observaciones)}. ` : ""}
        ${h.item.normativa ? `<em>Normativa: ${esc(h.item.normativa)}</em>.` : ""}
        <br><span class="plan-line">Acción correctiva propuesta: ______________________________ &nbsp; Responsable: ____________ &nbsp; Plazo: ____________</span>
      </li>`;
    });
    hallazgosHtml += `</ul>`;
  });
  return `
    <div class="informe-header">
      <h1>Informe de Auditoría — ${esc(g.nombre)}</h1>
      <table class="info-table">
        <tr><td><strong>Prestador</strong></td><td>${esc(c.nombre || "")}</td></tr>
        <tr><td><strong>Dirección</strong></td><td>${esc(c.direccion || "")}</td></tr>
        <tr><td><strong>Fecha de la visita</strong></td><td>${esc(v.fecha || "")}</td></tr>
        <tr><td><strong>Tipo de visita</strong></td><td>${v.tipo === "diagnostico" ? "Diagnóstico" : "Seguimiento"}</td></tr>
        <tr><td><strong>Responsable presente / cargo</strong></td><td>${esc((v.datos_generales && v.datos_generales.responsable) || "")}</td></tr>
        <tr><td><strong>Auditor/a(s)</strong></td><td>${esc(auditores)}</td></tr>
      </table>
    </div>
    <h2>1. Resultado</h2>
    <div class="semaforo-badge ${r.semaforo}">${r.pct !== null ? r.pct.toFixed(1) + "%" : "Sin datos"}</div>
    <h2 style="margin-top:20px;">2. Hallazgos y plan de acción</h2>
    ${hallazgosHtml || "<p>No se registraron hallazgos (No Cumple / Cumple Parcialmente) en los ítems auditados.</p>"}
    <h2>3. Conclusión</h2>
    <p contenteditable="true" class="editable-block">[Redactar aquí la conclusión general y las recomendaciones prioritarias.]</p>
    <div class="firmas">
      <div class="firma-box"><div class="firma-line"></div><span>Firma auditor/a</span></div>
      <div class="firma-box"><div class="firma-line"></div><span>Firma responsable del efector</span></div>
    </div>`;
}

function render() {
  const root = document.getElementById("root");
  if (APP.vista === "login") return renderLogin(root);
  if (APP.vista === "admin_centros") return renderAdminCentros(root);
  if (APP.vista === "admin_centro_detalle") return renderAdminCentroDetalle(root);
  if (APP.vista === "admin_checklist") return renderAdminChecklist(root);
  if (APP.vista === "admin_informe") return renderInformeView(root, true);
  if (APP.vista === "cliente_dashboard") return renderClienteDashboard(root);
  if (APP.vista === "cliente_informe") return renderInformeView(root, false);
}

function renderAdminChecklist(root) {
  const v = APP.visitaActiva;
  const gKey = v.grilla_key;
  const g = GRILLAS[gKey];
  if (!v.respuestas) v.respuestas = {};
  if (!v.datos_generales) v.datos_generales = {};
  if (!v.auditores || !v.auditores.length) v.auditores = [""];
  const resumen = calcularGrilla(gKey, v.respuestas);

  let html = topbar(`${c_nombre()} · ${g.nombre}`) + `<main id="main">
    <button class="btn-secondary" onclick="APP.vista='admin_centro_detalle'; render();">← Volver al centro</button>
    <div class="card">
      <h2>${esc(g.nombre)}</h2>
      <div class="semaforo-badge ${resumen.semaforo}">${resumen.pct !== null ? resumen.pct.toFixed(1) + "%" : "Sin datos"}</div>
      <div style="margin-top:14px;">
        <button class="btn-primary" onclick="guardarVisita(false)">💾 Guardar borrador</button>
        <button class="btn-secondary" onclick="guardarVisita(true)">✔ Publicar para el cliente</button>
        <button class="btn-secondary" onclick='verInforme(${JSON.stringify(v).replace(/'/g, "&apos;")})'>📄 Ver informe</button>
      </div>
    </div>

    <div class="card">
      <h3>Datos generales de la visita</h3>
      <div class="grid2">
        <label>Fecha <input id="dg-fecha" type="date" value="${esc(v.fecha || "")}"></label>
        <label>Tipo de visita
          <select id="dg-tipo">
            <option value="diagnostico" ${v.tipo === "diagnostico" ? "selected" : ""}>Diagnóstico</option>
            <option value="seguimiento" ${v.tipo === "seguimiento" ? "selected" : ""}>Seguimiento</option>
          </select>
        </label>
        <label>Responsable de la institución presente / cargo <input id="dg-responsable" value="${esc(v.datos_generales.responsable || "")}"></label>
      </div>
      <h4 class="subhead-field">Auditor/a(s) responsable(s)</h4>
      <div class="auditores-list">
        ${v.auditores.map((a, idx) => `<div class="auditor-row">
          <input class="auditor-input" data-idx="${idx}" placeholder="Nombre y Apellido / Profesión" value="${esc(a)}">
          ${v.auditores.length > 1 ? `<button class="btn-remove-auditor" data-idx="${idx}" title="Quitar">✕</button>` : ""}
        </div>`).join("")}
        <button class="btn-add-auditor">+ Agregar auditor/a</button>
      </div>
    </div>`;

  g.areas.forEach((area, areaIdx) => {
    const ac = calcularArea(gKey, areaIdx, v.respuestas);
    html += `<div class="card">
      <div class="area-head"><h3>${esc(area.title)}</h3>
        <div class="semaforo-badge small ${ac.semaforo}">${ac.pct !== null ? ac.pct.toFixed(1) + "%" : "—"} · ${ac.respondidos}/${ac.total}</div>
      </div>`;
    let lastSub = "__none__";
    area.items.forEach(it => {
      if (it.subarea !== lastSub) { if (it.subarea) html += `<div class="subarea">${esc(it.subarea)}</div>`; lastSub = it.subarea; }
      const k = keyItem(areaIdx, it.n);
      const r = v.respuestas[k] || {};
      html += `<div class="item">
        <div class="item-top">
          <span class="chip ${chipClass(it.criticidad)}">${esc(it.criticidad || "")}</span>
          <span class="item-n">#${it.n}</span>
        </div>
        <div class="item-text">${esc(it.item)}</div>
        ${it.normativa ? `<div class="item-norm">📖 ${esc(it.normativa)}</div>` : ""}
        <div class="item-controls">
          <div class="resp-group" data-key="${k}">
            ${RESPUESTAS.map(rv => `<button class="resp-btn ${r.respuesta === rv ? "sel " + respClass(rv) : ""}" data-resp="${rv}">${rv}</button>`).join("")}
          </div>
          <input class="obs-input" placeholder="Observaciones..." data-key="${k}" value="${esc(r.observaciones || "")}">
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</main>
    <button class="no-print" id="btn-scroll-top" title="Subir arriba para guardar"
      style="position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;
      background:var(--teal);color:#fff;border:none;font-size:22px;cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:50;">⬆</button>`;
  root.innerHTML = html;
  document.getElementById("btn-scroll-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  document.getElementById("dg-fecha").addEventListener("input", e => { v.fecha = e.target.value; });
  document.getElementById("dg-tipo").addEventListener("change", e => { v.tipo = e.target.value; });
  document.getElementById("dg-responsable").addEventListener("input", e => { v.datos_generales.responsable = e.target.value; });

  root.querySelectorAll(".auditor-input").forEach(inp => {
    inp.addEventListener("input", e => { v.auditores[parseInt(e.target.dataset.idx, 10)] = e.target.value; });
  });
  root.querySelector(".btn-add-auditor").addEventListener("click", () => { v.auditores.push(""); render(); });
  root.querySelectorAll(".btn-remove-auditor").forEach(btn => {
    btn.addEventListener("click", e => { v.auditores.splice(parseInt(e.target.dataset.idx, 10), 1); render(); });
  });

  root.querySelectorAll(".resp-group").forEach(grp => {
    grp.querySelectorAll(".resp-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const k = grp.dataset.key;
        if (!v.respuestas[k]) v.respuestas[k] = {};
        v.respuestas[k].respuesta = btn.dataset.resp;
        render();
      });
    });
  });
  root.querySelectorAll(".obs-input").forEach(inp => {
    inp.addEventListener("input", e => {
      const k = e.target.dataset.key;
      if (!v.respuestas[k]) v.respuestas[k] = {};
      v.respuestas[k].observaciones = e.target.value;
    });
  });
}
function c_nombre() { return APP.centroActivo ? APP.centroActivo.nombre : ""; }
function chipClass(crit) { if (crit === "Crítico") return "chip-critico"; if (crit === "Importante") return "chip-importante"; return "chip-menor"; }
function respClass(rv) { if (rv === "Cumple") return "resp-ok"; if (rv === "Cumple Parcialmente") return "resp-parcial"; if (rv === "No Cumple") return "resp-no"; return "resp-na"; }

  let html = topbar("Panel del centro") + `<main id="main">`;
  if (!APP.visitas.length) {
    html += `<div class="card"><p class="muted">Todavía no hay auditorías publicadas para tu centro. En cuanto GALA publique la primera, la vas a ver acá.</p></div>`;
  }
  Object.keys(porGrilla).forEach(gKey => {
    const visitasG = porGrilla[gKey];
    const ultima = visitasG[visitasG.length - 1];
    const r = calcularGrilla(gKey, ultima.respuestas || {});
    html += `<div class="card">
      <div class="area-head"><h2>${esc(GRILLAS[gKey].nombre)}</h2>
        <div class="semaforo-badge ${r.semaforo}">${r.pct !== null ? r.pct.toFixed(1) + "%" : "Sin datos"}</div>
      </div>
      <p class="muted">Última visita: ${ultima.fecha} (${ultima.tipo === "diagnostico" ? "diagnóstico" : "seguimiento"})</p>
      <button class="btn-secondary" onclick='verInformeCliente(${JSON.stringify(ultima).replace(/'/g, "&apos;")})'>📄 Ver informe de esta visita</button>

      <h3 style="margin-top:18px;">Evolución entre visitas</h3>
      <div style="display:flex;align-items:flex-end;gap:10px;height:120px;margin:14px 0;">
        ${visitasG.map(v => {
          const rv = calcularGrilla(gKey, v.respuestas || {});
          const h = rv.pct !== null ? Math.max(6, rv.pct) : 6;
          const color = rv.semaforo === "verde" ? "#2E8B57" : rv.semaforo === "amarillo" ? "#C98A1C" : rv.semaforo === "rojo" ? "#B23A3A" : "#B7C4C8";
          return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="font-size:11px;color:#5C6B73;">${rv.pct !== null ? rv.pct.toFixed(0) + "%" : "—"}</div>
            <div style="width:34px;height:${h}px;background:${color};border-radius:4px 4px 0 0;"></div>
            <div style="font-size:10px;color:#8a97a0;">${v.fecha}</div>
          </div>`;
        }).join("")}
      </div>

      <h3>Puntos a mejorar (No Conformidades)</h3>
      ${r.hallazgos.length ? r.hallazgos.map(h => `
        <div class="item">
          <span class="chip ${chipClass(h.item.criticidad)}">${esc(h.item.criticidad)}</span>
          <div class="item-text" style="margin-top:6px;">${esc(h.item.item)}</div>
          <div class="muted">Estado: ${h.respuesta}${h.observaciones ? " — " + esc(h.observaciones) : ""}</div>
        </div>`).join("") : `<p class="muted">Sin No Conformidades pendientes en la última visita. 🎉</p>`}
    </div>`;
  });
  html += `</main>`;
  root.innerHTML = html;
}
